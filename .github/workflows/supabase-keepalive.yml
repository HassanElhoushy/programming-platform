# يُبقي مشروع Supabase المجاني نشطاً.
#
# مشروع Supabase على الباقة المجانية بيتوقف لو ما حصلش عليه أي نشاط لمدة
# 7 أيام. الـ workflow ده بيبعت طلب قراءة بسيط جداً على جدول heartbeat كل
# يومين، فالمشروع يفضل شغال ومحدش يلاقي المنصة واقفة يوم امتحان.
#
# محتاج تضيف السرّين دول في:
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL              = https://cpwhdvcfwngtlxzbgcmp.supabase.co
#     SUPABASE_PUBLISHABLE_KEY  = sb_publishable_...
#
# المفتاح ده عام أصلاً وبيظهر في المتصفح، فمفيش خطورة فيه — بنحطه سرّاً
# للترتيب بس. وجدول heartbeat مفتوح للقراءة فقط بسياسة RLS مخصصة له.
#
# الخطوة الأخيرة بتحمي الـ workflow من نفسه: GitHub بيوقف الجدولة تلقائياً
# لو الريبو قعد 60 يوم من غير commit، وده بالظبط اللي بيحصل في الأجازة
# الصيفي — الوقت اللي محتاجين فيه الحماية دي أكتر حاجة. فبنعمل commit
# صغير كل ~50 يوم عشان العدّاد يرجع من أوله من غير تدخّل منك.

name: Supabase keep-alive

on:
  schedule:
    # الساعة 6 صباحاً بتوقيت UTC كل يومين
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: قراءة صف من جدول heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::السرّان SUPABASE_URL و SUPABASE_PUBLISHABLE_KEY لازم يتضافوا في إعدادات الريبو."
            exit 1
          fi

          status=$(curl --silent --show-error --fail-with-body \
            --max-time 30 \
            --output /tmp/response.json \
            --write-out "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/heartbeat?select=id&limit=1" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Accept: application/json")

          echo "HTTP ${status}"
          cat /tmp/response.json

          if [ "${status}" != "200" ]; then
            echo "::error::المشروع ما ردّش بنجاح. اتأكد إن ملفات SQL اتنفّذت وإن جدول heartbeat موجود."
            exit 1
          fi

          echo "المشروع شغال."

      # يمنع GitHub من إيقاف الجدولة بعد 60 يوم سكون. لا يعمل شيئاً في
      # الأيام العادية — فقط حين يقترب الريبو من الحد.
      - name: منع إيقاف الجدولة بعد 60 يوم سكون
        run: |
          set -euo pipefail

          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "آخر commit من ${age} يوم."

          if [ "${age}" -lt 50 ]; then
            echo "الريبو نشط، مفيش داعي لأي commit."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-activity
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity
          git commit -m "نبضة: إبقاء جدولة GitHub Actions فعّالة"
          git push
          echo "اتعمل commit عشان عدّاد الـ 60 يوم يرجع من أوله."
